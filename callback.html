<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Joule — Volvo authorisation</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #f5f5f5; }
    main { width: min(620px, calc(100% - 40px)); padding: 32px; border: 1px solid #444; border-radius: 16px; background: #1b1b1b; }
    h1 { margin-top: 0; }
    button { font: inherit; padding: 12px 16px; border: 0; border-radius: 10px; cursor: pointer; font-weight: 650; }
    .ok { color: #8ee59b; }
    .error { color: #ff9b9b; }
    .muted { color: #aaa; }
  </style>
</head>
<body>
<main>
  <h1>Joule</h1>
  <p id="status">Completing Volvo authorisation…</p>
  <button id="copy" hidden>Copy authorisation result</button>
  <p id="next" class="muted"></p>
  <p class="muted">This page contains no Volvo client secret, API key, refresh token or PKCE verifier. The one-time authorisation result is not stored or transmitted by this page.</p>
</main>
<script>
(() => {
  const status = document.getElementById('status');
  const copy = document.getElementById('copy');
  const next = document.getElementById('next');
  const originalUrl = window.location.href;
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const errorDescription = params.get('error_description');

  if (error) {
    status.className = 'error';
    status.textContent = `Volvo authorisation failed: ${errorDescription || error}`;
    return;
  }
  if (!code || !state) {
    status.className = code ? 'error' : '';
    status.textContent = code
      ? 'Volvo returned a code without state. Do not continue.'
      : 'Joule Volvo OAuth callback is ready.';
    return;
  }

  status.className = 'ok';
  status.textContent = 'Volvo authorisation returned successfully.';
  copy.hidden = false;
  next.textContent = 'Click the button, then paste the result into the waiting Joule OAuth helper on stormwatch.';

  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(originalUrl);
      copy.textContent = 'Copied ✓';
    } catch (_) {
      status.className = 'error';
      status.textContent = 'Clipboard access was blocked. Copy the complete address from the browser address bar instead.';
    }
  });

  // Keep the result available for the explicit copy action, but do not persist it.
  // The browser may retain the URL in history; replace it when the page is left.
  window.addEventListener('pagehide', () => {
    history.replaceState({}, document.title, window.location.pathname);
  });
})();
</script>
</body>
</html>
